<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>help_crack · tv</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tv.css') }}">
</head>
<body>
  <header>
    <div class="brand">help_crack<span>tv</span></div>
    <div class="pillbar">
      <span class="pill" id="pill">…</span>
      <span class="pill subtle" id="phase"></span>
      <span class="mono dim" id="clock"></span>
      <a class="back" href="/">dashboard ↗</a>
    </div>
  </header>

  <main>
    <section class="kpis">
      <div class="kpi hero">
        <label>speed</label>
        <b id="k-speed">—</b>
      </div>
      <div class="kpi">
        <label>progress</label>
        <b id="k-progress">—</b>
        <div class="bar"><i id="k-bar"></i></div>
      </div>
      <div class="row">
        <div class="kpi small"><label>eta</label><b id="k-eta">—</b></div>
        <div class="kpi small"><label>uptime</label><b id="k-uptime">—</b></div>
      </div>
      <div class="row">
        <div class="kpi small"><label>keys</label><b id="k-keys">0</b></div>
        <div class="kpi small"><label>proof of work</label><b id="k-pow">0</b></div>
      </div>
      <div class="kpi">
        <label>gpu</label>
        <b id="k-gpu">—</b>
      </div>
      <div class="kpi">
        <label>recovered</label>
        <b id="k-recovered">—</b>
      </div>
    </section>

    <section class="globe">
      <div class="globe-wrap">
        <canvas id="globe" aria-label="country distribution — drag to look around"
                title="drag to rotate the globe; it starts spinning again 30 s after you let go"></canvas>
      </div>
      <div class="countries" id="countries"></div>
      <div class="caption" id="caption">sampling the site…</div>
    </section>

    <section class="site">
      <h2>wpa-sec · last 24h</h2>
      <div class="wall" id="wall"></div>
      <h2>all time</h2>
      <div class="wall" id="wall-all"></div>
      <h2>latest keys</h2>
      <ul class="keys" id="keys"></ul>
    </section>
  </main>

  <footer><div id="ticker">…</div></footer>
  <script src="{{ url_for('static', filename='tv.js') }}"></script>
</body>
</html>
